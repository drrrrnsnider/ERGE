<!doctype html>
<!-- DARK ONLY. The `dark` class is load-bearing, not a preference.

     The vendored base-nova components carry their own `dark:` utilities, and
     src/styles/theme.css binds that variant to this class. Remove the class
     and every one of those utilities stops matching: surfaces, borders and
     the outline button all silently revert to their light-mode styling on top
     of our dark tokens. There is no light theme to fall back to.

     A Playwright test asserts this class is present, so deleting it fails the
     suite instead of quietly changing every screen. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets content reach under the notch and home
         indicator once this is wrapped as a native app. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Dark only, so the UA paints form controls, scrollbars and the
         canvas dark too rather than flashing light on first paint. -->
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Plan a trip as one itinerary: flights, hotels, restaurants, rideshare and events."
    />
    <title>ERGE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
